name: Home-Meds 2 Development APK
on:
  push:
    branches: [homemeds-2.0-architecture]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www/src && cp index.html www/index.html && cp src/* www/src/
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure persistent APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/homemeds-dev.keystore
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          signing='''    signingConfigs {
              homemeds {
                  storeFile file("homemeds-dev.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }
          '''
          s=s.replace("    buildTypes {", signing+ "    buildTypes {", 1)
          s=s.replace("        debug {", "        debug {\n            signingConfig signingConfigs.homemeds", 1)
          s=s.replace("versionCode 1", "versionCode 2", 1)
          p.write_text(s)
          PY
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: homemeds2-dev-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
