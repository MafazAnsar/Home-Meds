name: Home-Meds 2 Development APK
on:
  push:
    branches: [homemeds-2.0-architecture]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www/src && cp index.html www/index.html && cp src/* www/src/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: homemeds2-dev-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
