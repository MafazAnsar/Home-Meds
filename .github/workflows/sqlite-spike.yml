name: Home-Meds SQLite Android Spike
on:
  push:
    branches: [homemeds-2.0-architecture]
    paths:
      - 'sqlite-spike/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/sqlite-spike.yml'
  workflow_dispatch:
jobs:
  build-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx vite build --config sqlite-spike/vite.config.js
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: homemeds-sqlite-spike-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
