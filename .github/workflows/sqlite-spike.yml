name: Home-Meds SQLite Android Spike
on:
  push:
    branches: [homemeds-2.0-architecture]
    paths:
      - 'sqlite-spike/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/sqlite-spike.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Bootstrap committed package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already committed"
          else
            git commit -m "Add reproducible dependency lockfile"
            git push origin HEAD:homemeds-2.0-architecture
          fi
      # Emit structured audit findings before enforcing the gate, so all
      # blocking advisories (including transitive ones) are visible in CI logs.
      - name: Diagnose npm audit findings
        run: |
          npm audit --json > audit-report.json || true
          node -e "const a=require('./audit-report.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url})}))"
      - run: npm audit --audit-level=high
      - run: npx vite build --config sqlite-spike/vite.config.js
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: homemeds-sqlite-spike-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
